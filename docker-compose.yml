version: "3.9"

services:

  # -------------------------------------------------------
  # 固定資産税評価マイクロサービス (FastAPI)
  # -------------------------------------------------------
  api:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: property-tax-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------
  # WebGIS フロントエンド (Nginx 静的配信)
  # -------------------------------------------------------
  webgis:
    image: nginx:1.27-alpine
    container_name: property-tax-webgis
    ports:
      - "8080:80"
    volumes:
      - ./webgis:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
